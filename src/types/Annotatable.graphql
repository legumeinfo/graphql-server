interface Annotatable
#implements HasDataSets & HasOntologyAnnotations & HasPublications
{
  # Note: identifier may be null for some entities (e.g., Traits associated with GeneFunctions)
  identifier: ID
  # HasDataSets
  dataSets: [DataSet!]!
  # HasOntologyAnnotations
  ontologyAnnotations: [OntologyAnnotation!]!
  # HasPublications
  publications: [Publication!]!
}
