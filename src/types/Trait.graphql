type Trait implements Annotatable
#& HasGWAS & HasGWASResults & HasOrganism & HasQTLs & HasQTLStudy & HasDataSets & HasOntologyAnnotations & HasPublications
{
  id: ID!
  # Annotatable
  # Note: identifier may be null for some traits (e.g., those associated with GeneFunctions)
  identifier: ID
  dataSets: [DataSet!]!
  ontologyAnnotations: [OntologyAnnotation!]!
  publications: [Publication!]!
  # HasGWAS
  gwas: GWAS
  # HasGWASResults
  gwasResults: [GWASResult!]!
  # HasOrganism: TODO: make non-null
  organism: Organism
  # HasQTLs
  qtls: [QTL!]!
  # HasQTLStudy
  qtlStudy: QTLStudy
  # Trait
  name: String!
  description: String
}

